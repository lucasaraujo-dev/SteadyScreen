# nginx site for SteadyScreen. Copy to /etc/nginx/sites-available/steadyscreen,
# replace DOMAIN, link it into sites-enabled, then run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN        (adds HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Rooms API and the signaling WebSocket go to the Go server.
    location ~ ^/(api/|ws$|healthz$) {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Keep idle room connections open.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else is the website.
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
