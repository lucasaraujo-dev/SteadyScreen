# coturn: relays the video when two browsers can't connect directly.
# The secret is passed on the command line from .env (TURN_SECRET), never here.

listening-port=3478
# Ports the relayed video uses; open the same range (UDP) in the firewall.
min-port=49160
max-port=49400

realm=steadyscreen
use-auth-secret
fingerprint

# Only WebRTC: no old-style long-term users, no admin console.
no-cli
no-tls
no-dtls
no-multicast-peers

# Don't let anyone use the relay to reach machines inside the VPS or its
# private networks (Docker, Tailscale, localhost...).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits per user so one visitor can't take the whole VPS.
user-quota=12
total-quota=200

log-file=stdout
simple-log
