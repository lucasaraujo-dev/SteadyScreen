# Everything SteadyScreen needs on the VPS. Run from this folder:
#   cp .env.example .env   (then fill it in)
#   docker compose up -d --build
#
# The VPS's own nginx is the front door (HTTPS via certbot): it sends the
# domain to the site and /api + /ws to the server. See nginx.conf.
name: steadyscreen

services:
  web:
    build:
      context: ../web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3210}:3000"

  server:
    build:
      context: ../server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-8210}:8080"
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN}
      MAX_VIEWERS: ${MAX_VIEWERS:-5}
      # Our TURN relay (the turn service below); browsers get a password
      # that expires, made from TURN_SECRET.
      TURN_URLS: ${TURN_URLS:-turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-steadyscreen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-steadyscreen}?sslmode=disable
      # Email for the confirmation code (any SMTP service). Empty = off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy

  # TURN relay: carries the video when two browsers can't connect directly
  # (most home routers and phone networks). Uses the VPS's own network so
  # the relay ports work as they are; open them in the firewall:
  #   3478 tcp+udp, 49160-49400 udp
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in .env}

  # Database for accounts, chats and the like. Only reachable inside Docker
  # (no port open to the internet); data lives in the postgres_data volume.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steadyscreen}
      POSTGRES_USER: ${POSTGRES_USER:-steadyscreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
